name: Build قطعی برق APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4

      - name: باز کردن پروژه اندروید
        run: |
          unzip -q qate_bargh_project.zip -d android_project

      - name: نصب Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ساخت APK
        working-directory: android_project
        run: gradle :app:assembleDebug --no-daemon

      - name: آماده‌سازی APK
        run: |
          mkdir -p output
          cp android_project/app/build/outputs/apk/debug/app-debug.apk output/qate-bargh.apk

      - name: قرار دادن APK برای دانلود
        uses: actions/upload-artifact@v4
        with:
          name: qate-bargh-apk
          path: output/qate-bargh.apk
          retention-days: 30
